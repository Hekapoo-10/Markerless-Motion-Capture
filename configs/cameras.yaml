backend: dshow
format:
  width: 1280
  height: 800
  fps: 30
  fourcc: MJPG
  fps_measured: 30.2
exposure: -8
dup_max_fraction: 0.001
cameras:
  front_left:
    position: depan kiri peserta
    usb_port: PCIROOT(0)#PCI(0803)#PCI(0000)#USBROOT(0)#USB(1)#USB(3)
  front:
    position: depan tengah
    usb_port: PCIROOT(0)#PCI(0801)#PCI(0004)#USBROOT(0)#USB(2)#USB(2)
  front_right:
    position: depan kanan peserta
    usb_port: PCIROOT(0)#PCI(0801)#PCI(0003)#USBROOT(0)#USB(1)#USB(1)
  top:
    position: tepat di atas tangan
    usb_port: PCIROOT(0)#PCI(0801)#PCI(0004)#USBROOT(0)#USB(2)#USB(1)
  wing_left:
    position: sayap kiri peserta
    usb_port: PCIROOT(0)#PCI(0803)#PCI(0000)#USBROOT(0)#USB(1)#USB(4)
  wing_right:
    position: sayap kanan peserta
    usb_port: PCIROOT(0)#PCI(0801)#PCI(0003)#USBROOT(0)#USB(1)#USB(2)
